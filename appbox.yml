app:
  display_name: Nextcloud
  publisher: Nextcloud
  description: Nextcloud is a self-hosted collaboration platform for file sync and sharing.

image:
  name: repo.cylo.net/nextcloud
  version: 35.0.0-3
  tag: 35.0.0-3
  digest: repo.cylo.net/nextcloud@sha256:79d413a16f82989c7b49fcc28f5d2caedc1c06878deea5098b9f15ce968a3c80

container:
  memory: 4
  memory_swap: 4
  memory_reservation: 3
  cpus: 0
  init: true

networking:
  is_web_app: true
  subdomain: nextcloud

ports:
  combined:
    range: '22'

behavior:
  app_slots: 1
  expect_callback: true
  callback_requires_auth: false
  can_update: false
  allow_downgrade: false
  ssl_restart: true
