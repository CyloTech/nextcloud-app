app:
  display_name: Nextcloud
  publisher: Nextcloud
  description: Nextcloud is a self-hosted collaboration platform for file sync and sharing.

image:
  name: repo.cylo.net/nextcloud
  version: 35.0.0-4
  tag: 35.0.0-4
  digest: repo.cylo.net/nextcloud@sha256:5ffeef884defcb09fd788d04aa2fb6560d4d1c559e49d9691b5ccccab4e819e3

container:
  memory: 4
  memory_swap: 4
  memory_reservation: 3
  cpus: 0
  init: true

networking:
  is_web_app: true
  subdomain: nextcloud

ports:
  combined:
    range: '22'

behavior:
  app_slots: 1
  expect_callback: true
  callback_requires_auth: false
  can_update: false
  allow_downgrade: false
  ssl_restart: true
