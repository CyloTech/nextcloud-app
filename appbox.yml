app:
  display_name: Nextcloud
  publisher: Nextcloud
  description: Nextcloud is a self-hosted collaboration platform for file sync and sharing.

image:
  name: repo.cylo.net/nextcloud
  version: 35.0.0-1
  tag: 35.0.0-1
  digest: repo.cylo.net/nextcloud@sha256:999f764c46eba0fc5e6246a57c6e18864f11c479fd18a0955ebe3531a053770e

container:
  memory: 4
  memory_swap: 4
  memory_reservation: 3
  cpus: 0
  init: true

networking:
  is_web_app: true
  subdomain: nextcloud

ports:
  combined:
    range: '22'

behavior:
  app_slots: 1
  expect_callback: true
  callback_requires_auth: false
  can_update: false
  allow_downgrade: false
  ssl_restart: true
