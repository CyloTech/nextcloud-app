app:
  display_name: Nextcloud
  publisher: Nextcloud
  description: Nextcloud is a self-hosted collaboration platform for file sync and sharing.

image:
  name: repo.cylo.net/nextcloud
  version: 35.0.0-5
  tag: 35.0.0-5
  digest: repo.cylo.net/nextcloud@sha256:7f6f0473f114bba2f5b8d0d57db25002722e0fa45f0389fb281e4b557bcde56a

container:
  memory: 4
  memory_swap: 4
  memory_reservation: 3
  cpus: 0
  init: true

networking:
  is_web_app: true
  subdomain: nextcloud

ports:
  combined:
    range: '22'

behavior:
  app_slots: 1
  expect_callback: true
  callback_requires_auth: false
  can_update: false
  allow_downgrade: false
  ssl_restart: true
