# Redis for Nextcloud's transactional file locking (memcache.locking) and
# distributed cache (memcache.distributed). Only Nextcloud in this container
# uses it, through the unix socket; no TCP port is opened. Lock and cache
# entries are rebuilt on demand, so nothing is written to disk.
port 0
unixsocket /run/redis/redis.sock
unixsocketperm 770
daemonize no
supervised no
dir /run/redis
logfile ""
loglevel notice
save ""
appendonly no
maxmemory 256mb
maxmemory-policy allkeys-lru
